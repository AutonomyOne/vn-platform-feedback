[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "platform-feedback"
version = "0.1.0"
description = "Single-import feedback SDK for all platform microservices"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
fastapi    = ["fastapi>=0.111.0", "starlette>=0.37.0"]
starlette  = ["starlette>=0.37.0"]
django     = ["django>=4.2"]
flask      = ["flask>=3.0.0"]
streamlit  = ["streamlit>=1.35.0", "requests>=2.31.0"]
all        = [
    "fastapi>=0.111.0",
    "starlette>=0.37.0",
    "django>=4.2",
    "flask>=3.0.0",
    "streamlit>=1.35.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["platform_feedback*"]
