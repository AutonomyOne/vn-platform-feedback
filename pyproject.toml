[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-feedback"
version = "0.2.0"
description = "Single-import feedback SDK for all platform microservices"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
fastapi    = ["fastapi>=0.111.0", "starlette>=0.37.0"]
starlette  = ["starlette>=0.37.0"]
django     = ["django>=4.2"]
flask      = ["flask>=3.0.0"]
streamlit  = ["streamlit>=1.35.0", "requests>=2.31.0"]
test       = ["pytest>=8.0"]
all        = [
    "fastapi>=0.111.0",
    "starlette>=0.37.0",
    "django>=4.2",
    "flask>=3.0.0",
    "streamlit>=1.35.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["platform_feedback*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
